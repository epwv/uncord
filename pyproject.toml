[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uncord"
dynamic = ["version"]
description = "A Discord client for the terminal, with voice, images and screen sharing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: Communications :: Chat",
]
authors = [{ name = "owainxyz", email = "281472559+owainxyz@users.noreply.github.com" }]
dependencies = [
    "discord.py-self[voice] @ git+https://github.com/dolfies/discord.py-self@2ba64a9a997e151a9c259984e0a179b1fdf4aff4",
    "textual>=8.2,<9",
    "rich>=13",
    "textual-image>=0.12",
    "pillow>=10",
    "pynacl>=1.6",
    "davey>=0.1.7",
    "cryptography>=42",
    "segno>=1.6",
    "jeepney>=0.8",
]

[project.urls]
Homepage = "https://github.com/owainxyz/uncord"
Issues = "https://github.com/owainxyz/uncord/issues"

[project.scripts]
uncord = "uncord.__main__:main"

[tool.setuptools]
packages = ["uncord"]

