name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: pip install . pyflakes
      - name: lint
        run: pyflakes uncord setup.py
      - name: import
        run: |
          cd /tmp
          python -c "import uncord, uncord._native, uncord.app; print(uncord.__version__)"
          uncord --help

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck install.sh
      - name: dry run
        run: ./install.sh --dry-run --no-system
